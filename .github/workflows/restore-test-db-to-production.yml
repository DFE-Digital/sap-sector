name: Restore test database to production

on:
  workflow_dispatch:
    inputs:
      confirm-production:
        description: Must be set to true to restore the production database
        required: true
        default: 'false'
        type: choice
        options:
        - 'false'
        - 'true'
      restore-reason:
        description: Reason for restoring the test database into production
        required: true
        type: string
      test-backup-file:
        description: Backup blob name, including .sql.gz. For production storage this may be a path inside the database-backup container.
        required: true
        type: string
      backup-storage-location:
        description: Where the backup file currently exists
        required: true
        default: test
        type: choice
        options:
        - test
        - production

permissions:
  contents: read
  id-token: write

env:
  BACKUP_CONTAINER: database-backup
  SERVICE_NAME: get-school-improvement-insights
  SERVICE_SHORT: sapsec
  TF_VARS_PATH: terraform/application/config

jobs:
  validate-inputs:
    name: Validate restore request
    runs-on: ubuntu-latest
    outputs:
      test-backup-file: ${{ steps.names.outputs.test-backup-file }}
      restore-backup-file: ${{ steps.names.outputs.restore-backup-file }}
      production-backup-input-file: ${{ steps.names.outputs.production-backup-input-file }}
      production-backup-file: ${{ steps.names.outputs.production-backup-file }}
    steps:
    - name: Validate production confirmation
      shell: bash
      env:
        CONFIRM_PRODUCTION: ${{ inputs.confirm-production }}
        RESTORE_REASON: ${{ inputs.restore-reason }}
      run: |
        set -euo pipefail
        if [ "${CONFIRM_PRODUCTION}" != "true" ]; then
          echo "confirm-production must be true to restore production."
          exit 1
        fi

        if [ -z "${RESTORE_REASON}" ]; then
          echo "restore-reason is required."
          exit 1
        fi

    - name: Resolve backup file names
      id: names
      shell: bash
      env:
        TEST_BACKUP_FILE_INPUT: ${{ inputs.test-backup-file }}
      run: |
        set -euo pipefail
        today="$(TZ=Europe/London date +%F)"

        if [ -z "${TEST_BACKUP_FILE_INPUT}" ]; then
          echo "test-backup-file is required. Create it first using the Backup database to Azure storage workflow, or manually copy it into production backup storage."
          exit 1
        fi

        test_backup_file="${TEST_BACKUP_FILE_INPUT}"

        if [[ ! "${test_backup_file}" =~ ^[A-Za-z0-9._/-]+\.sql\.gz$ ]] || [[ "${test_backup_file}" == /* ]] || [[ "${test_backup_file}" == *..* ]] || [[ "${test_backup_file}" == *//* ]]; then
          echo "test-backup-file must end in .sql.gz and can only contain letters, numbers, dots, underscores, hyphens, and forward slashes. It cannot start with / or contain .. or //."
          exit 1
        fi

        restore_backup_file="${test_backup_file}"
        if [[ "${test_backup_file}" == */* ]]; then
          restore_backup_file="${SERVICE_SHORT}_pd_manual_test_restore_${today}_${GITHUB_RUN_NUMBER}.sql.gz"
        fi

        production_backup_input_file="${SERVICE_SHORT}_pd_before_test_restore_${today}_${GITHUB_RUN_NUMBER}.sql"
        production_backup_file="${production_backup_input_file}.gz"

        echo "test-backup-file=${test_backup_file}" >> "$GITHUB_OUTPUT"
        echo "restore-backup-file=${restore_backup_file}" >> "$GITHUB_OUTPUT"
        echo "production-backup-input-file=${production_backup_input_file}" >> "$GITHUB_OUTPUT"
        echo "production-backup-file=${production_backup_file}" >> "$GITHUB_OUTPUT"

  validate-test-backup:
    name: Validate test backup exists
    needs: validate-inputs
    if: ${{ inputs.backup-storage-location == 'test' }}
    runs-on: ubuntu-latest
    environment:
      name: test
    steps:
    - uses: actions/checkout@v4

    - uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}

    - name: Set test storage variables
      shell: bash
      run: |
        set -euo pipefail
        source global_config/test.sh
        echo "TEST_RESOURCE_GROUP_NAME=${AZURE_RESOURCE_PREFIX}-${SERVICE_SHORT}-${CONFIG_SHORT}-rg" >> "$GITHUB_ENV"
        echo "TEST_STORAGE_ACCOUNT_NAME=${AZURE_RESOURCE_PREFIX}${SERVICE_SHORT}dbbkp${CONFIG_SHORT}sa" >> "$GITHUB_ENV"
        echo "TEST_AZURE_SUBSCRIPTION=${AZURE_SUBSCRIPTION}" >> "$GITHUB_ENV"

    - name: Check test backup exists
      shell: bash
      env:
        TEST_BACKUP_FILE: ${{ needs.validate-inputs.outputs.test-backup-file }}
      run: |
        set -euo pipefail
        az config set extension.use_dynamic_install=yes_without_prompt
        az config set core.only_show_errors=true

        test_connection_string="$(az storage account show-connection-string \
          --resource-group "${TEST_RESOURCE_GROUP_NAME}" \
          --name "${TEST_STORAGE_ACCOUNT_NAME}" \
          --subscription "${TEST_AZURE_SUBSCRIPTION}" \
          --query connectionString \
          --output tsv)"

        echo "::add-mask::${test_connection_string}"

        test_backup_exists="$(az storage blob exists \
          --container-name "${BACKUP_CONTAINER}" \
          --name "${TEST_BACKUP_FILE}" \
          --connection-string "${test_connection_string}" \
          --query exists \
          --output tsv)"

        if [ "${test_backup_exists}" != "true" ]; then
          echo "Test backup ${TEST_BACKUP_FILE} was not found in ${TEST_STORAGE_ACCOUNT_NAME}/${BACKUP_CONTAINER}."
          exit 1
        fi

  backup-production:
    name: Backup production database
    needs:
    - validate-inputs
    - validate-test-backup
    if: ${{ always() && needs.validate-inputs.result == 'success' && (inputs.backup-storage-location == 'production' || needs.validate-test-backup.result == 'success') }}
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency: deploy_production
    steps:
    - uses: actions/checkout@v4

    - name: Set production environment variables
      shell: bash
      run: |
        set -euo pipefail
        source global_config/production.sh
        tf_vars_file="${TF_VARS_PATH}/production.tfvars.json"
        echo "CLUSTER=$(jq -r '.cluster' "${tf_vars_file}")" >> "$GITHUB_ENV"
        echo "NAMESPACE=$(jq -r '.namespace' "${tf_vars_file}")" >> "$GITHUB_ENV"
        echo "RESOURCE_GROUP_NAME=${AZURE_RESOURCE_PREFIX}-${SERVICE_SHORT}-${CONFIG_SHORT}-rg" >> "$GITHUB_ENV"
        echo "STORAGE_ACCOUNT_NAME=${AZURE_RESOURCE_PREFIX}${SERVICE_SHORT}dbbkp${CONFIG_SHORT}sa" >> "$GITHUB_ENV"

    - name: Backup production postgres before restore
      uses: DFE-Digital/github-actions/backup-postgres@master
      with:
        storage-account: ${{ env.STORAGE_ACCOUNT_NAME }}
        resource-group: ${{ env.RESOURCE_GROUP_NAME }}
        app-name: ${{ env.SERVICE_NAME }}-production
        namespace: ${{ env.NAMESPACE }}
        cluster: ${{ env.CLUSTER }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        backup-file: ${{ needs.validate-inputs.outputs.production-backup-input-file }}
        teams-webhook-url: ${{ secrets.TEAMS_WEBHOOK_URL }}
        service: ${{ vars.TEAMS_MSG_SERVICE_NAME }}

  restore-production:
    name: Restore test backup to production
    needs:
    - validate-inputs
    - validate-test-backup
    - backup-production
    if: ${{ always() && needs.validate-inputs.result == 'success' && (inputs.backup-storage-location == 'production' || needs.validate-test-backup.result == 'success') && needs.backup-production.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency: deploy_production
    steps:
    - uses: actions/checkout@v4

    - uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}

    - name: Set production and test storage variables
      shell: bash
      run: |
        set -euo pipefail

        source global_config/test.sh
        echo "TEST_RESOURCE_GROUP_NAME=${AZURE_RESOURCE_PREFIX}-${SERVICE_SHORT}-${CONFIG_SHORT}-rg" >> "$GITHUB_ENV"
        echo "TEST_STORAGE_ACCOUNT_NAME=${AZURE_RESOURCE_PREFIX}${SERVICE_SHORT}dbbkp${CONFIG_SHORT}sa" >> "$GITHUB_ENV"
        echo "TEST_AZURE_SUBSCRIPTION=${AZURE_SUBSCRIPTION}" >> "$GITHUB_ENV"

        source global_config/production.sh
        tf_vars_file="${TF_VARS_PATH}/production.tfvars.json"
        echo "CLUSTER=$(jq -r '.cluster' "${tf_vars_file}")" >> "$GITHUB_ENV"
        echo "NAMESPACE=$(jq -r '.namespace' "${tf_vars_file}")" >> "$GITHUB_ENV"
        echo "PRODUCTION_RESOURCE_GROUP_NAME=${AZURE_RESOURCE_PREFIX}-${SERVICE_SHORT}-${CONFIG_SHORT}-rg" >> "$GITHUB_ENV"
        echo "PRODUCTION_STORAGE_ACCOUNT_NAME=${AZURE_RESOURCE_PREFIX}${SERVICE_SHORT}dbbkp${CONFIG_SHORT}sa" >> "$GITHUB_ENV"
        echo "PRODUCTION_AZURE_SUBSCRIPTION=${AZURE_SUBSCRIPTION}" >> "$GITHUB_ENV"

    - name: Copy test backup into production backup storage
      if: ${{ inputs.backup-storage-location == 'test' }}
      shell: bash
      env:
        TEST_BACKUP_FILE: ${{ needs.validate-inputs.outputs.test-backup-file }}
        RESTORE_BACKUP_FILE: ${{ needs.validate-inputs.outputs.restore-backup-file }}
      run: |
        set -euo pipefail
        az config set extension.use_dynamic_install=yes_without_prompt
        az config set core.only_show_errors=true

        test_connection_string="$(az storage account show-connection-string \
          --resource-group "${TEST_RESOURCE_GROUP_NAME}" \
          --name "${TEST_STORAGE_ACCOUNT_NAME}" \
          --subscription "${TEST_AZURE_SUBSCRIPTION}" \
          --query connectionString \
          --output tsv)"
        production_connection_string="$(az storage account show-connection-string \
          --resource-group "${PRODUCTION_RESOURCE_GROUP_NAME}" \
          --name "${PRODUCTION_STORAGE_ACCOUNT_NAME}" \
          --subscription "${PRODUCTION_AZURE_SUBSCRIPTION}" \
          --query connectionString \
          --output tsv)"

        echo "::add-mask::${test_connection_string}"
        echo "::add-mask::${production_connection_string}"

        production_backup_exists="$(az storage blob exists \
          --container-name "${BACKUP_CONTAINER}" \
          --name "${RESTORE_BACKUP_FILE}" \
          --connection-string "${production_connection_string}" \
          --query exists \
          --output tsv)"

        if [ "${production_backup_exists}" = "true" ]; then
          echo "Backup ${RESTORE_BACKUP_FILE} already exists in ${PRODUCTION_STORAGE_ACCOUNT_NAME}/${BACKUP_CONTAINER}."
          exit 1
        fi

        az storage blob download \
          --container-name "${BACKUP_CONTAINER}" \
          --name "${TEST_BACKUP_FILE}" \
          --file "${RESTORE_BACKUP_FILE}" \
          --connection-string "${test_connection_string}" \
          --output none

        gzip -t "${RESTORE_BACKUP_FILE}"

        az storage blob upload \
          --container-name "${BACKUP_CONTAINER}" \
          --name "${RESTORE_BACKUP_FILE}" \
          --file "${RESTORE_BACKUP_FILE}" \
          --connection-string "${production_connection_string}" \
          --overwrite false \
          --output none

    - name: Validate backup already exists in production backup storage
      if: ${{ inputs.backup-storage-location == 'production' }}
      shell: bash
      env:
        TEST_BACKUP_FILE: ${{ needs.validate-inputs.outputs.test-backup-file }}
        RESTORE_BACKUP_FILE: ${{ needs.validate-inputs.outputs.restore-backup-file }}
      run: |
        set -euo pipefail
        az config set extension.use_dynamic_install=yes_without_prompt
        az config set core.only_show_errors=true

        production_connection_string="$(az storage account show-connection-string \
          --resource-group "${PRODUCTION_RESOURCE_GROUP_NAME}" \
          --name "${PRODUCTION_STORAGE_ACCOUNT_NAME}" \
          --subscription "${PRODUCTION_AZURE_SUBSCRIPTION}" \
          --query connectionString \
          --output tsv)"

        echo "::add-mask::${production_connection_string}"

        production_backup_exists="$(az storage blob exists \
          --container-name "${BACKUP_CONTAINER}" \
          --name "${TEST_BACKUP_FILE}" \
          --connection-string "${production_connection_string}" \
          --query exists \
          --output tsv)"

        if [ "${production_backup_exists}" != "true" ]; then
          echo "Backup ${TEST_BACKUP_FILE} was not found in ${PRODUCTION_STORAGE_ACCOUNT_NAME}/${BACKUP_CONTAINER}."
          exit 1
        fi

        if [ "${TEST_BACKUP_FILE}" != "${RESTORE_BACKUP_FILE}" ]; then
          restore_backup_exists="$(az storage blob exists \
            --container-name "${BACKUP_CONTAINER}" \
            --name "${RESTORE_BACKUP_FILE}" \
            --connection-string "${production_connection_string}" \
            --query exists \
            --output tsv)"

          if [ "${restore_backup_exists}" = "true" ]; then
            echo "Backup ${RESTORE_BACKUP_FILE} already exists in ${PRODUCTION_STORAGE_ACCOUNT_NAME}/${BACKUP_CONTAINER}."
            exit 1
          fi

          az storage blob download \
            --container-name "${BACKUP_CONTAINER}" \
            --name "${TEST_BACKUP_FILE}" \
            --file "${RESTORE_BACKUP_FILE}" \
            --connection-string "${production_connection_string}" \
            --output none

          gzip -t "${RESTORE_BACKUP_FILE}"

          az storage blob upload \
            --container-name "${BACKUP_CONTAINER}" \
            --name "${RESTORE_BACKUP_FILE}" \
            --file "${RESTORE_BACKUP_FILE}" \
            --connection-string "${production_connection_string}" \
            --overwrite false \
            --output none
        fi

    - name: Restore production postgres from test backup
      uses: DFE-Digital/github-actions/restore-postgres-backup@master
      with:
        storage-account: ${{ env.PRODUCTION_STORAGE_ACCOUNT_NAME }}
        resource-group: ${{ env.PRODUCTION_RESOURCE_GROUP_NAME }}
        app-name: ${{ env.SERVICE_NAME }}-production
        cluster: ${{ env.CLUSTER }}
        namespace: ${{ env.NAMESPACE }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        backup-file: ${{ needs.validate-inputs.outputs.restore-backup-file }}

    - name: Restore summary
      if: success()
      shell: bash
      env:
        RESTORE_REASON: ${{ inputs.restore-reason }}
        BACKUP_STORAGE_LOCATION: ${{ inputs.backup-storage-location }}
      run: |
        {
          echo "## Test database restored to production"
          echo ""
          echo "- Reason: ${RESTORE_REASON}"
          echo "- Backup storage location: ${BACKUP_STORAGE_LOCATION}"
          echo "- Source backup: ${{ needs.validate-inputs.outputs.test-backup-file }}"
          echo "- Production restore backup: ${{ needs.validate-inputs.outputs.restore-backup-file }}"
          echo "- Production pre-restore backup: ${{ needs.validate-inputs.outputs.production-backup-file }}"
          echo "- Destination storage: ${PRODUCTION_STORAGE_ACCOUNT_NAME}/${BACKUP_CONTAINER}"
        } >> "$GITHUB_STEP_SUMMARY"
